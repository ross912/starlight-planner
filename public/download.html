<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1c">
<title>星光手帐 App 下载</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1100px 600px at 80% -10%, #2b3a6e 0%, transparent 60%),
                radial-gradient(900px 500px at -10% 110%, #3a2b5e 0%, transparent 55%),
                linear-gradient(160deg, #0b0e1c 0%, #080a14 55%, #05060c 100%);
    color: #eef1fb;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .55; animation: twinkle 3.2s ease-in-out infinite; }
  .stars i:nth-child(2n) { width: 2px; height: 2px; animation-delay: 1.1s; }
  .stars i:nth-child(3n) { width: 4px; height: 4px; animation-delay: 2.2s; }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .8; } }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 360px;
    text-align: center;
  }
  .icon {
    width: 120px; height: 120px;
    border-radius: 28px;
    margin: 0 auto 22px;
    display: block;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: 3px; margin-bottom: 40px; }

  .btn {
    display: block; width: 100%;
    padding: 16px 0; border-radius: 18px;
    background: linear-gradient(135deg, #f7c948, #f2994a);
    color: #241a02; font-size: 17px; font-weight: 700; letter-spacing: 1px;
    text-decoration: none;
    box-shadow: 0 12px 30px rgba(242,153,74,.35);
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.97); }

  /* 微信引导遮罩 */
  .wx-mask {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(5,6,12,.96);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px; text-align: center;
  }
  .wx-mask .corner {
    position: absolute; top: 16px; right: 20px;
    font-size: 15px; color: #f7c948; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .wx-mask .corner .dots { font-size: 18px; letter-spacing: 1px; }
  .wx-mask .arrow { font-size: 40px; margin: 46px 0 10px; animation: bounce 1.4s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .wx-mask .tip { font-size: 20px; line-height: 1.7; color: #fff; font-weight: 600; }
  .wx-mask .tip b { color: #f7c948; font-size: 24px; }
  .wx-mask .sub { margin-top: 12px; font-size: 14px; color: #9aa4cf; line-height: 1.8; }
  .linkbox { margin-top: 26px; width: 100%; max-width: 320px; }
  .linkbox input {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    color: #eef1fb; font-size: 13px; text-align: center; outline: none;
  }
  .linkbox .lbl { font-size: 12px; color: #8f99c2; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="card">
    <img class="icon" src="icon.png" alt="星光手帐">
    <h1>星光手帐</h1>
    <a class="btn" id="dlBtn" href="starlight-hc-v1.1.0.apk">下载安装</a>
  </div>

  <!-- 微信内引导 -->
  <div class="wx-mask" id="wxMask">
    <div class="corner"><span>点右上角</span><span class="dots">···</span></div>
    <div class="arrow">⬆️</div>
    <p class="tip">请点击右上角 <b>···</b><br>选择「在浏览器中打开」</p>
    <p class="sub">微信无法直接安装 App<br>用浏览器打开后即可下载</p>
    <div class="linkbox">
      <div class="lbl">也可以长按下方链接复制，用浏览器打开</div>
      <input type="text" readonly value="https://zixin.space/download.html" onclick="this.select()">
    </div>
  </div>

<script>
  // 星光
  (function () {
    var box = document.getElementById('stars'), html = '';
    for (var i = 0; i < 36; i++) {
      html += '<i style="left:' + (Math.random() * 100).toFixed(2) + '%;top:' +
        (Math.random() * 100).toFixed(2) + '%;animation-delay:' +
        (Math.random() * 3).toFixed(2) + 's"></i>';
    }
    box.innerHTML = html;
  })();

  // 微信 UA 判断
  var isWx = /MicroMessenger/i.test(navigator.userAgent);
  if (!isWx) {
    // 浏览器：自动开始下载
    setTimeout(function () {
      window.location.href = 'starlight-hc-v1.1.0.apk';
    }, 900);
  } else {
    document.getElementById('wxMask').style.display = 'flex';
  }
</script>
</body>
</html>
